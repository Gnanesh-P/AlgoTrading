server:
  # Render injects the PORT env var at runtime. Falls back to 8080 locally.
  port: ${PORT:8080}

spring:
  application:
    name: algo-trading-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata

app:
  jwt:
    # !! Set JWT_SECRET in Render env vars — must be >= 64 chars for HS512 !!
    secret: ${JWT_SECRET:AlgoTradingSecretKey2024@#$%AlgoTradingSecretKey2024@#$%AlgoTradingSecretKey}
    expiration-ms: ${JWT_EXPIRY_MS:86400000}   # 24 hours default
  credentials:
    # Up to 4 users sharing one Zerodha account.
    # Override with Render/Docker env vars. Entries with a blank username are ignored.
    users:
      - username: ${APP_USERNAME:admin}
        password: ${APP_PASSWORD:admin123}
      - username: ${APP_USER2:gowtham}
        password: ${APP_PASS2:admin123}
      - username: ${APP_USER3:nithish}
        password: ${APP_PASS3:nithish123}
      - username: ${APP_USER4:gnanesh}
        password: ${APP_PASS4:gnanesh123}
  # Persistent data directory.  On Render: mount a disk at /data and set DATA_DIR=/data
  users-file:   ${USERS_FILE:./data/users.json}
  session-file: ${SESSION_FILE:./data/session.json}
  trading:
    market-open: "09:15"
    market-close: "15:30"

kite:
  # Set KITE_API_KEY and KITE_API_SECRET in Render env vars
  api-key:    ${KITE_API_KEY:aykvxt41g0ppgtu2}
  api-secret: ${KITE_API_SECRET:qw7ymyy044a4nb6c3yf6h3ncd7955l1u}
  # KITE_ACCESS_TOKEN is set after each daily login (update in Render or via /api/kite/callback)
  access-token: ${KITE_ACCESS_TOKEN:}
  # KITE_REDIRECT_URL must be your Render service URL, e.g.:
  #   https://your-service-name.onrender.com/api/kite/callback
  redirect-url: ${KITE_REDIRECT_URL:http://localhost:8080/api/kite/callback}
  base-url:  https://api.kite.trade
  login-url: https://kite.zerodha.com/connect/login

logging:
  level:
    com.algotrading: DEBUG
    org.springframework.security: WARN
