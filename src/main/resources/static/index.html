<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Algo Trading — Multi-Strategy</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- MAIN DASHBOARD -->
<div id="dashboard" class="screen">

  <!-- TOP NAV -->
  <nav class="topnav">
    <div class="nav-left">
      <span class="logo-sm">📈 PilotX</span>
      <span id="running-badge" class="price-badge">0 / 4 Running</span>
    </div>
    <div class="nav-right">
      <span id="kite-status-badge" class="badge badge-disconnected">Kite: Not Connected</span>
      <button id="btn-kite-disconnect" class="btn btn-sm btn-outline" onclick="disconnectKite()" style="display:none;">🔌 Disconnect Kite</button>
      <button id="btn-theme" class="btn btn-sm btn-outline" onclick="toggleTheme()" title="Toggle light/dark theme">☀️</button>
      <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- MARKET QUOTES / FUNDS BAR -->
  <div id="quotes-bar" class="quotes-bar"></div>

  <!-- KITE CONNECT BANNER -->
  <div id="kite-banner" class="kite-banner">
    <div>
      <span>⚠️ Kite not connected — connect once to start receiving live tick data.</span>
      <div style="font-size:11px;color:#a78233;margin-top:3px;">
        Token is saved automatically and restored on every restart. Set a fresh token each morning (Kite tokens expire daily).
      </div>
    </div>
    <div class="banner-actions">
      <button class="btn btn-warning" onclick="connectKite()">Connect via OAuth</button>
      <span style="color:#888;font-size:12px;">OR paste token:</span>
      <input type="text" id="manual-token" placeholder="Kite Access Token" class="input-sm"/>
      <button id="btn-set-token" class="btn btn-sm btn-outline" onclick="setManualToken()">Set Token</button>
    </div>
  </div>

  <!-- WORKSPACE: sidebar nav (4 strategies + NIFTY OI signal, live status+P&L) + detail panel -->
  <div class="workspace">
    <aside class="strategy-sidebar" id="strategy-sidebar"></aside>
    <main class="strategy-detail" id="strategy-detail"></main>
  </div>

  <!-- FOOTER STATUS BAR -->
  <footer class="status-bar">
    <span id="footer-time">—</span>
    <span id="footer-ws">WS: Disconnected</span>
  </footer>

</div>

<!-- TOAST NOTIFICATION CONTAINER -->
<div id="toast-container"></div>

<script src="/js/app.js"></script>
</body>
</html>
